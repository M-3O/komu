name: Build verification

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Linux / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Compilation placeholders only. No database service or GitHub secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/komu_ci?connect_timeout=1
      AUTH_SECRET: ci-placeholder-not-a-real-secret-at-least-32-characters
      DISCORD_CLIENT_ID: "000000000000000000"
      DISCORD_CLIENT_SECRET: ci-placeholder-not-a-discord-secret
      DISCORD_BOT_TOKEN: ci-placeholder-not-a-discord-token
      NEXT_PUBLIC_APP_URL: https://komu-ci.invalid
      KOMU_DISABLE_STREAM_POLLING: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify worker root builder selection
        if: hashFiles('railpack.json') != ''
        run: |
          test ! -e Dockerfile
          test ! -e dockerfile
          test -f Dockerfile.worker.fallback
          test -f Dockerfile.worker.fallback.dockerignore
          test -f deploy/bot/Dockerfile
          test -f deploy/bot/Dockerfile.dockerignore

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx --no-install prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (no PostgreSQL integration suites)
        run: npm test -- --config vitest.config.ts --pool=threads --maxWorkers=1

      - name: Build dashboard
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build bot (generate only; does not start the bot)
        run: npm run build:bot
        env:
          NODE_ENV: production

      # Isolated worker image; never push it or invoke its bot entrypoint.
      - name: Build worker Docker image
        run: docker build --file deploy/bot/Dockerfile --tag komu-bot:ci .

      - name: Verify worker image has no baked database URL
        run: |
          docker image inspect komu-bot:ci --format '{{json .Config.Env}}' |
            node -e 'let s=""; process.stdin.on("data", c => s+=c); process.stdin.on("end", () => { if (JSON.parse(s).some(v => /^(DATABASE_URL|KOMU_NEON_TEST_DATABASE_URL|DISCORD_BOT_TOKEN|BOT_MONITORING_SECRET)=/.test(v))) throw Error("Worker image contains forbidden runtime configuration"); });'

      - name: Verify worker native Prisma engine without networking
        run: |
          docker run --rm --network none --entrypoint node komu-bot:ci -e '
            const fs=require("node:fs"), path=require("node:path");
            const directory=path.resolve("node_modules/.prisma/client");
            const binary=fs.readdirSync(directory).find(name => /^libquery_engine-.*\.so\.node$/.test(name));
            if (!binary) throw Error("Generated Linux Prisma engine missing");
            require(path.join(directory,binary));
            if (fs.existsSync(".env") || fs.existsSync(".env.local")) throw Error("Environment file in worker image");
            console.log("Generated native Prisma engine loaded; no database connection attempted");'

      - name: Verify direct Node worker imports without networking or login
        run: |
          docker run --rm --network none \
            -e NODE_ENV=production \
            -e 'DATABASE_URL=postgresql://ci:ci@127.0.0.1:9/komu_ci?connect_timeout=1' \
            --entrypoint node komu-bot:ci --import tsx scripts/check-bot.ts


      # Worker-branch only. Planning/building images is not a CranL deployment.
      - name: Install pinned Railpack for worker verification
        if: hashFiles('railpack.json') != ''
        run: |
          curl --fail --location --retry 2 \
            https://github.com/railwayapp/railpack/releases/download/v0.43.0/railpack-v0.43.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/railpack.tar.gz"
          printf '%s  %s\n' '248a8f60f36854aabed6124113631078a802de3461660855fc4de9c26065c1fb' "$RUNNER_TEMP/railpack.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/railpack-bin"
          tar -xzf "$RUNNER_TEMP/railpack.tar.gz" -C "$RUNNER_TEMP/railpack-bin"
          echo "$RUNNER_TEMP/railpack-bin" >> "$GITHUB_PATH"

      - name: Prepare and inspect worker Railpack plan
        if: hashFiles('railpack.json') != ''
        run: |
          railpack prepare --config-file railpack.json --plan-out "$RUNNER_TEMP/worker-railpack-plan.json" .
          node scripts/verify-worker-railpack-plan.cjs "$RUNNER_TEMP/worker-railpack-plan.json"

      - name: Build worker image using Railpack frontend
        if: hashFiles('railpack.json') != ''
        run: |
          docker buildx build --load --tag komu-bot:railpack-ci \
            --build-arg BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v0.43.0 \
            --file "$RUNNER_TEMP/worker-railpack-plan.json" .

      - name: Verify Railpack worker image offline without starting the bot
        if: hashFiles('railpack.json') != ''
        run: |
          docker image inspect komu-bot:railpack-ci --format '{{json .Config.Env}}' |
            node -e 'let s=""; process.stdin.on("data", c => s+=c); process.stdin.on("end", () => { if (JSON.parse(s).some(v => /^(DATABASE_URL|KOMU_NEON_TEST_DATABASE_URL|DISCORD_BOT_TOKEN|BOT_MONITORING_SECRET)=/.test(v))) throw Error("Forbidden runtime configuration in image"); });'
          docker run --rm --network none --entrypoint node komu-bot:railpack-ci -e '
            const fs=require("node:fs"),path=require("node:path");
            if(process.versions.node.split(".")[0]!=="24")throw Error("Node 24 required");
            require.resolve("tsx");
            require.resolve("@prisma/client");
            const root=path.resolve("node_modules/.prisma/client");
            const binary=fs.readdirSync(root).find(n=>/^libquery_engine-.*\.so\.node$/.test(n));
            if(!binary)throw Error("Native Linux Prisma engine missing");
            require(path.join(root,binary));
            if(fs.readdirSync(".").some(n=>n===".env"||n.startsWith(".env.")))throw Error("Environment file in image");'
          docker run --rm --network none \
            -e 'DATABASE_URL=postgresql://ci:ci@127.0.0.1:9/komu_ci?connect_timeout=1' \
            --entrypoint node komu-bot:railpack-ci --import tsx scripts/check-bot.ts
